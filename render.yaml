# Render 一键部署蓝图：https://render.com/deploy?repo=https://github.com/001ship/lucky
# 读取本文件后自动创建：Web 服务（Docker 构建）+ 托管 PostgreSQL，并注入 ARTEX_PG_DSN。
services:
  - type: web
    name: lucky
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # 先用免费档把服务跑起来；生产环境改成 starter 及以上
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ARTEX_PG_DSN
        fromDatabase:
          name: lucky-db
          property: connectionString
      - key: TZ
        value: Asia/Shanghai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ARTEX_LLM_BASE_URL
        sync: false
      - key: ARTEX_LLM_MODEL
        sync: false

databases:
  - name: lucky-db
    # 免费库 30 天后过期，正式用请换 basic-256mb 及以上
    plan: free
    region: singapore
    databaseName: lucky
    user: lucky